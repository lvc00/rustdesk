name: Android Build

# 只编译 Dart + 复用官方 librustdesk.so，但必须先自行生成 flutter_rust_bridge 绑定
# （仓库里没有 flutter/lib/generated_bridge.dart，它是构建产物）
# 基线：RustDesk 1.5.3 / Flutter 3.24.5 / FRB 1.80.1

on:
  push:
    branches:
      - ui-ux
    paths:
      - 'flutter/lib/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:
    inputs:
      version:
        description: '官方 RustDesk 版本（提供 librustdesk.so）'
        required: true
        default: '1.5.3'
      abi:
        description: '目标 ABI'
        required: true
        type: choice
        default: 'arm64-v8a'
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64

env:
  FLUTTER_VERSION: '3.24.5'
  RD_VERSION: '1.5.3'
  RUST_VERSION: '1.75'
  CARGO_EXPAND_VERSION: '1.0.95'
  FRB_VERSION: '1.80.1'

concurrency:
  group: android-ux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install codegen system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang libclang-dev llvm-dev libgtk-3-dev ninja-build pkg-config

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache cargo bins
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-bridge-${{ runner.os }}-${{ env.CARGO_EXPAND_VERSION }}-${{ env.FRB_VERSION }}

      - name: Install cargo-expand and flutter_rust_bridge_codegen
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          if ! command -v cargo-expand >/dev/null 2>&1; then
            cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          fi
          if ! command -v flutter_rust_bridge_codegen >/dev/null 2>&1; then
            cargo install flutter_rust_bridge_codegen --version ${{ env.FRB_VERSION }} --features "uuid" --locked
          fi
          cargo-expand --version
          flutter_rust_bridge_codegen --version

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('flutter/android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: pub get
        working-directory: flutter
        run: flutter pub get

      - name: Generate flutter_rust_bridge bindings
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h
          ls -l flutter/lib/generated_bridge*.dart src/bridge_generated.rs

      - name: Fetch librustdesk.so from official APK
        shell: bash
        env:
          VER: ${{ inputs.version || env.RD_VERSION }}
        run: |
          set -euo pipefail
          BASE="https://github.com/rustdesk/rustdesk/releases/download/${VER}"
          FOUND=""
          for n in "rustdesk-${VER}-aarch64-signed.apk" "rustdesk-${VER}-universal-signed.apk" "rustdesk-${VER}-universal.apk" "rustdesk-${VER}-aarch64.apk"; do
            echo "try $n"
            if curl -fL --retry 3 --retry-delay 2 -o /tmp/rd.apk "$BASE/$n"; then FOUND="$n"; break; fi
          done
          test -n "$FOUND" || { echo "no apk found for $VER"; exit 1; }
          echo "using $FOUND"
          unzip -o -q /tmp/rd.apk 'lib/*/librustdesk.so' -d /tmp/x
          mkdir -p flutter/android/app/src/main/jniLibs
          cp -rv /tmp/x/lib/* flutter/android/app/src/main/jniLibs/
          find flutter/android/app/src/main/jniLibs -name '*.so' -exec ls -lh {} \;

      - name: Build APK
        working-directory: flutter
        shell: bash
        env:
          ABI: ${{ inputs.abi || 'arm64-v8a' }}
        run: |
          case "$ABI" in
            arm64-v8a)   T=android-arm64 ;;
            armeabi-v7a) T=android-arm ;;
            x86_64)      T=android-x64 ;;
            *)           T="" ;;
          esac
          if [ -z "$T" ]; then
            flutter build apk --release
          else
            flutter build apk --release --target-platform "$T"
          fi

      - name: List output
        if: always()
        run: ls -lh flutter/build/app/outputs/flutter-apk/ || true

      - name: Upload generated bridge
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-bridge
          path: |
            flutter/lib/generated_bridge.dart
            flutter/lib/generated_bridge.freezed.dart
            src/bridge_generated.rs
          if-no-files-found: warn
          retention-days: 30

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-ux-apk
          path: flutter/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
