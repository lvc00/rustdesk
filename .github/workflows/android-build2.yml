name: Android Build v2

# Build the P1 UX patch on the REAL upstream tag 1.5.3.
# The official 1.5.3 librustdesk.so exports exactly 16 Java_ffi_FFI_* symbols,
# while master's ffi.kt declares 18 (adds setDocumentLogsEnabled and
# setInputServiceOpen). Mixing master Kotlin with the 1.5.3 .so caused
# UnsatisfiedLinkError on startup. So: check out tag 1.5.3, overlay only the
# two P1 Dart files from ui-ux, regenerate the FRB bridge from 1.5.3's own
# src/flutter_ffi.rs, and reuse the official 1.5.3 native libs.
#
# The P1 files are written TWICE on purpose: once early (so codegen sees them)
# and once immediately before `flutter build apk` (so no intermediate step can
# revert them). A post-build gate then asserts RawTrackpadLayer really ended up
# inside libapp.so, otherwise the run fails instead of shipping stock behaviour.

on:
  push:
    branches:
      - ui-ux
    paths:
      - 'flutter/lib/**'
      - '.github/workflows/android-build2.yml'
  workflow_dispatch:
    inputs:
      version:
        description: 'official rustdesk version providing librustdesk.so'
        required: true
        default: '1.5.3'
      abi:
        description: 'target abi'
        type: choice
        default: 'arm64-v8a'
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64

env:
  FLUTTER_VERSION: '3.24.5'
  RD_VERSION: '1.5.3'
  RUST_VERSION: '1.75'
  CARGO_EXPAND_VERSION: '1.0.95'
  FRB_VERSION: '1.80.1'

permissions:
  contents: write

concurrency:
  group: android-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - name: Checkout upstream tag 1.5.3 (JNI-matched baseline)
        uses: actions/checkout@v4
        with:
          repository: rustdesk/rustdesk
          ref: 1.5.3
          submodules: recursive
          fetch-depth: 1

      - name: Verify baseline JNI surface
        shell: bash
        run: |
          echo "baseline commit: $(git rev-parse HEAD)"
          N=$(grep -c 'external fun' flutter/android/app/src/main/kotlin/ffi.kt)
          echo "external fun count: $N"
          test "$N" = "16" || { echo "ERROR: expected 16 JNI declarations (tag 1.5.3)"; exit 1; }
          if grep -q 'setDocumentLogsEnabled\|setInputServiceOpen' flutter/android/app/src/main/kotlin/ffi.kt; then
            echo "ERROR: master-only JNI declarations present"; exit 1
          fi
          echo "OK: baseline matches official 1.5.3 librustdesk.so"

      - name: Apply P1 UX patch from ui-ux
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          D=flutter/lib/common/widgets
          for f in raw_trackpad.dart remote_input.dart; do
            curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github.raw+json" \
              "https://api.github.com/repos/$REPO/contents/$D/$f?ref=ui-ux" \
              -o "$D/$f"
          done
          sed -i 's/^        return RawTrackpadLayer($/    return RawTrackpadLayer(/' "$D/remote_input.dart"
          echo "--- patch verification ---"
          wc -l "$D/raw_trackpad.dart" "$D/remote_input.dart"
          grep -n "raw_trackpad.dart\|RawTrackpadLayer" "$D/remote_input.dart"
          echo "jni declarations: $(grep -c 'external fun' flutter/android/app/src/main/kotlin/ffi.kt)"

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install codegen system deps
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang libclang-dev llvm-dev ninja-build pkg-config unzip

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Cache cargo bins
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-bridge-${{ runner.os }}-${{ env.CARGO_EXPAND_VERSION }}-${{ env.FRB_VERSION }}

      - name: Install codegen tools
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup component add rustfmt
          if ! command -v cargo-expand >/dev/null 2>&1; then
            cargo install cargo-expand --version ${{ env.CARGO_EXPAND_VERSION }} --locked
          fi
          if ! command -v flutter_rust_bridge_codegen >/dev/null 2>&1; then
            cargo install flutter_rust_bridge_codegen --version ${{ env.FRB_VERSION }} --features "uuid" --locked
          fi
          cargo-expand --version
          flutter_rust_bridge_codegen --version

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('flutter/android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: pub get
        working-directory: flutter
        run: flutter pub get

      - name: Generate flutter_rust_bridge bindings
        shell: bash
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          flutter_rust_bridge_codegen \
            --rust-input ./src/flutter_ffi.rs \
            --dart-output ./flutter/lib/generated_bridge.dart \
            --c-output ./flutter/macos/Runner/bridge_generated.h
          cp ./flutter/macos/Runner/bridge_generated.h ./flutter/ios/Runner/bridge_generated.h
          ls -l flutter/lib/generated_bridge*.dart src/bridge_generated.rs
          echo "post-codegen RawTrackpadLayer refs: $(grep -c 'RawTrackpadLayer' flutter/lib/common/widgets/remote_input.dart || true)"

      - name: Fetch native libs from official APK
        shell: bash
        env:
          VER: ${{ inputs.version || env.RD_VERSION }}
          ABI: ${{ inputs.abi || 'arm64-v8a' }}
        run: |
          set -euo pipefail
          BASE="https://github.com/rustdesk/rustdesk/releases/download/${VER}"
          FOUND=""
          for n in "rustdesk-${VER}-aarch64-signed.apk" "rustdesk-${VER}-universal-signed.apk" "rustdesk-${VER}-universal.apk" "rustdesk-${VER}-aarch64.apk"; do
            echo "try $n"
            if curl -fL --retry 3 --retry-delay 2 -o /tmp/rd.apk "$BASE/$n"; then FOUND="$n"; break; fi
          done
          test -n "$FOUND" || { echo "no apk found for $VER"; exit 1; }
          echo "using $FOUND"
          rm -rf /tmp/x && mkdir -p /tmp/x
          # ONLY the Rust core plus its C++ runtime. Never libapp.so (the Dart AOT
          # snapshot) or libflutter.so: shipping the official copies would overwrite
          # the UI we just compiled and silently restore stock behaviour.
          unzip -o -q /tmp/rd.apk "lib/${ABI}/librustdesk.so" "lib/${ABI}/libc++_shared.so" -d /tmp/x
          mkdir -p flutter/android/app/src/main/jniLibs/${ABI}
          rm -f "flutter/android/app/src/main/jniLibs/${ABI}/libapp.so" \
                "flutter/android/app/src/main/jniLibs/${ABI}/libflutter.so"
          cp -v /tmp/x/lib/${ABI}/librustdesk.so /tmp/x/lib/${ABI}/libc++_shared.so \
                flutter/android/app/src/main/jniLibs/${ABI}/
          find flutter/android/app/src/main/jniLibs -name '*.so' -exec ls -lh {} \;
          echo "--- JNI symbols in librustdesk.so ---"
          nm -D --defined-only "flutter/android/app/src/main/jniLibs/${ABI}/librustdesk.so" 2>/dev/null | grep -c 'Java_ffi_FFI_' || true

      - name: Build APK
        working-directory: flutter
        shell: bash
        env:
          ABI: ${{ inputs.abi || 'arm64-v8a' }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          D=lib/common/widgets
          echo "=== pre-build patch state ==="
          echo "remote_input.dart RawTrackpadLayer refs: $(grep -c 'RawTrackpadLayer' $D/remote_input.dart || true)"
          echo "remote_input.dart md5: $(md5sum $D/remote_input.dart | cut -d' ' -f1)"
          echo "raw_trackpad.dart exists: $([ -f $D/raw_trackpad.dart ] && echo yes || echo no)"
          if [ -f $D/raw_trackpad.dart ]; then
            echo "raw_trackpad.dart lines: $(wc -l < $D/raw_trackpad.dart)"
            echo "raw_trackpad useRawTrackpadLayer: $(grep -n 'useRawTrackpadLayer = ' $D/raw_trackpad.dart || true)"
          fi
          echo "=== re-apply P1 right before compile ==="
          for f in raw_trackpad.dart remote_input.dart; do
            curl -fsSL --retry 5 --retry-delay 3 --retry-all-errors \
              -H "Authorization: Bearer $TOKEN" \
              -H "Accept: application/vnd.github.raw+json" \
              "https://api.github.com/repos/$REPO/contents/flutter/$D/$f?ref=ui-ux" \
              -o "$D/$f"
          done
          sed -i 's/^        return RawTrackpadLayer($/    return RawTrackpadLayer(/' $D/remote_input.dart
          echo "after re-patch RawTrackpadLayer refs: $(grep -c 'RawTrackpadLayer' $D/remote_input.dart)"
          echo "after re-patch raw_trackpad lines: $(wc -l < $D/raw_trackpad.dart)"
          grep -n "import 'package:flutter_hbb/common/widgets/raw_trackpad.dart';" $D/remote_input.dart
          case "$ABI" in
            arm64-v8a)   T=android-arm64; OUT=app-arm64-v8a-release.apk ;;
            armeabi-v7a) T=android-arm;   OUT=app-armeabi-v7a-release.apk ;;
            x86_64)      T=android-x64;   OUT=app-x86_64-release.apk ;;
          esac
          sed -i "s/signingConfigs.release/signingConfigs.debug/g" android/app/build.gradle
          sed -i "s/org.gradle.jvmargs=-Xmx1024M/org.gradle.jvmargs=-Xmx2g/g" android/gradle.properties
          grep -n "signingConfig" android/app/build.gradle || true
          # Flutter sometimes ends the CLI with a ToolExit (rc=2) after printing
          # "Built ..." because of its file watcher ("Already watching path").
          # The APK is fine in that case, so judge by the artifact instead of the
          # exit code. Do NOT delete the output dir: that makes Gradle think
          # assembleRelease is up to date and skip packaging entirely.
          MARK=/tmp/apk_marker
          touch "$MARK"
          set +e
          flutter build apk --release --target-platform "$T" --split-per-abi 2>&1 | tee /tmp/build.log
          RC=${PIPESTATUS[0]}
          set -e
          echo "flutter build exit code: $RC"
          ls -l build/app/outputs/flutter-apk/ || true
          if [ ! -f "build/app/outputs/flutter-apk/$OUT" ]; then
            echo "=== BUILD FAILED: APK was not produced ==="
            tail -120 /tmp/build.log || true
            echo "::error::APK missing after flutter build (rc=$RC)"
            grep -a -m3 -E "Error|error:|FAILURE|What went wrong" /tmp/build.log | sed 's/^/::error::/' || true
            exit 1
          fi
          if [ "build/app/outputs/flutter-apk/$OUT" -ot "$MARK" ]; then
            echo "::warning::APK is older than the build start; Gradle may have skipped packaging"
          fi
          echo "APK produced: $OUT (flutter rc=$RC)"

      - name: Verify P1 code is inside the APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(ls "$GITHUB_WORKSPACE"/flutter/build/app/outputs/flutter-apk/app-*-release.apk | head -1)
          echo "apk: $APK"
          rm -rf /tmp/chk && mkdir -p /tmp/chk
          unzip -o -q "$APK" "lib/arm64-v8a/libapp.so" -d /tmp/chk
          N=$(grep -ac "RawTrackpadLayer" /tmp/chk/lib/arm64-v8a/libapp.so || true)
          echo "RawTrackpadLayer occurrences in libapp.so: $N"
          echo "RawTouchGestureDetectorRegion occurrences: $(grep -ac 'RawTouchGestureDetectorRegion' /tmp/chk/lib/arm64-v8a/libapp.so || true)"
          test "$N" -gt 0 || { echo "ERROR: P1 gesture code is NOT in the APK"; exit 1; }
          echo "OK: P1 gesture layer compiled into the APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-ux-apk
          path: flutter/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish APK to Release ux-latest
        if: success()
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          A=$(ls "$GITHUB_WORKSPACE"/flutter/build/app/outputs/flutter-apk/app-*-release.apk | head -1)
          OUT="$RUNNER_TEMP/rustdesk-1.5.3-ux-arm64-v8a.apk"
          cp "$A" "$OUT"
          if ! GH_TOKEN="$TOKEN" gh release view ux-latest >/dev/null 2>&1; then
            GH_TOKEN="$TOKEN" gh release create ux-latest --title "RustDesk UX (1.5.3 baseline)" --notes "Automated UX build on tag 1.5.3"
          fi
          GH_TOKEN="$TOKEN" gh release upload ux-latest "$OUT" --clobber
          echo "published: $(ls -lh "$OUT")"

      - name: Upload generated bridge
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-bridge
          path: |
            flutter/lib/generated_bridge.dart
            src/bridge_generated.rs
          if-no-files-found: warn
          retention-days: 14

      - name: Publish build log
        if: always()
        continue-on-error: true
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rm -rf /tmp/lg && mkdir -p /tmp/lg && cd /tmp/lg
          {
            echo "### job status: ${{ job.status }}"
            echo
            echo "### run: ${{ github.run_id }} / attempt ${{ github.run_attempt }} at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "### sha: ${{ github.sha }}"
            echo
            echo "### baseline: upstream tag 1.5.3 / 16 JNI declarations"
            echo
            echo "### versions"
            flutter --version || true
            java -version 2>&1 || true
            echo
            echo "### patch state"
            grep -c 'RawTrackpadLayer' "$GITHUB_WORKSPACE/flutter/lib/common/widgets/remote_input.dart" 2>/dev/null || echo "remote_input missing"
            echo
            echo "### apk content check"
            APK=$(ls "$GITHUB_WORKSPACE"/flutter/build/app/outputs/flutter-apk/app-*-release.apk 2>/dev/null | head -1)
            if [ -n "$APK" ] && [ -f "$APK" ]; then
              rm -rf /tmp/lgchk && mkdir -p /tmp/lgchk
              unzip -o -q "$APK" "lib/*/libapp.so" -d /tmp/lgchk 2>/dev/null || true
              for s in /tmp/lgchk/lib/*/libapp.so; do
                [ -f "$s" ] || continue
                echo "$s RawTrackpadLayer=$(grep -ac 'RawTrackpadLayer' "$s" || true)"
              done
            fi
            echo
            echo "### jniLibs"
            find "$GITHUB_WORKSPACE/flutter/android/app/src/main/jniLibs" -name '*.so' -exec ls -lh {} \; || true
            echo
            echo "### build log"
            tail -n 200 /tmp/build.log 2>/dev/null || echo "NO BUILD LOG"
          } > diag.txt
          git init -q .
          git add -A
          git -c user.name=ci -c user.email=ci@localhost commit -qm "ci log"
          git push -f "https://x-access-token:${TOKEN}@github.com/lvc00/rustdesk.git" HEAD:refs/heads/ci-log
