name: Android UX Build

# 路线 A：不编译 Rust，复用官方 APK 内的 librustdesk.so
# 适用：只改 flutter/lib 下的交互层（手势、悬浮球、键盘、缩放）
# 基线：RustDesk 1.5.3 + Flutter 3.24.5

on:
  push:
    branches:
      - ui-ux
    paths:
      - 'flutter/lib/**'
      - '.github/workflows/android-ux.yml'
  workflow_dispatch:
    inputs:
      version:
        description: '官方 RustDesk 版本（提供 librustdesk.so）'
        required: true
        default: '1.5.3'
      abi:
        description: '目标 ABI'
        required: true
        type: choice
        default: 'arm64-v8a'
        options:
          - arm64-v8a
          - armeabi-v7a
          - x86_64

env:
  FLUTTER_VERSION: '3.24.5'
  RD_VERSION: '1.5.3'

concurrency:
  group: android-ux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('flutter/android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Fetch librustdesk.so from official APK
        shell: bash
        env:
          VER: ${{ inputs.version || env.RD_VERSION }}
        run: |
          set -euo pipefail
          BASE="https://github.com/rustdesk/rustdesk/releases/download/${VER}"
          FOUND=""
          for n in "rustdesk-${VER}-aarch64-signed.apk" "rustdesk-${VER}-universal-signed.apk" "rustdesk-${VER}-universal.apk" "rustdesk-${VER}-aarch64.apk"; do
            echo "try $n"
            if curl -fL --retry 3 --retry-delay 2 -o /tmp/rd.apk "$BASE/$n"; then FOUND="$n"; break; fi
          done
          test -n "$FOUND" || { echo "no apk found for $VER"; exit 1; }
          echo "using $FOUND"
          unzip -o -q /tmp/rd.apk 'lib/*/librustdesk.so' -d /tmp/x
          mkdir -p flutter/android/app/src/main/jniLibs
          cp -rv /tmp/x/lib/* flutter/android/app/src/main/jniLibs/
          find flutter/android/app/src/main/jniLibs -name '*.so' -exec ls -lh {} \;

      - name: pub get
        working-directory: flutter
        run: flutter pub get

      - name: Build APK
        working-directory: flutter
        shell: bash
        env:
          ABI: ${{ inputs.abi || 'arm64-v8a' }}
        run: |
          case "$ABI" in
            arm64-v8a)   T=android-arm64 ;;
            armeabi-v7a) T=android-arm ;;
            x86_64)      T=android-x64 ;;
            *)           T="" ;;
          esac
          if [ -z "$T" ]; then
            flutter build apk --release
          else
            flutter build apk --release --target-platform "$T"
          fi

      - name: List output
        if: always()
        run: ls -lh flutter/build/app/outputs/flutter-apk/ || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rustdesk-ux-apk
          path: flutter/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
          retention-days: 14
