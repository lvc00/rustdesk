name: Publish APK

# Copies the APK produced by Android Build v2 into a GitHub Release so it can be
# downloaded without authentication (artifacts require a logged-in session).

on:
  push:
    paths:
      - '.github/workflows/publish-apk.yml'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'source workflow run id that produced rustdesk-ux-apk'
        required: true
        default: '44559174844'
      asset_name:
        description: 'file name of the release asset'
        required: true
        default: 'rustdesk-1.5.3-ux-arm64-v8a.apk'

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact from source run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
          ASSET: ${{ inputs.asset_name }}
        run: |
          set -euo pipefail
          mkdir -p out
          AID=$(gh api "repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name=="rustdesk-ux-apk") | .id' | head -1)
          echo "artifact id: ${AID}"
          test -n "${AID}"
          gh api "repos/${{ github.repository }}/actions/artifacts/${AID}/zip" > out/apk.zip
          ls -l out
          cd out
          unzip -o -q apk.zip
          ls -lh
          FOUND=$(find . -name '*.apk' | head -1)
          echo "found apk: ${FOUND}"
          test -n "${FOUND}"
          cp "${FOUND}" "../${ASSET}"
          cd ..
          ls -lh "${ASSET}"

      - name: Publish to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET: ${{ inputs.asset_name }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          TAG=ux-latest
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release exists"
          else
            gh release create "$TAG" \
              --title "RustDesk UX build" \
              --notes "Patched Android client (raw trackpad gesture layer). Built from run ${RUN_ID}."
          fi
          gh release upload "$TAG" "$ASSET" --clobber
          gh release view "$TAG" --json assets --jq '.assets[] | .name'
