name: Setup 153

# Rebuild the UX patch on the real tag 1.5.3.
#
# Why: the official librustdesk.so exposes exactly 16 JNI symbols, matching tag
# 1.5.3's ffi.kt one for one. The previous ui-ux branch was branched from master,
# whose ffi.kt declares 18 (adds setDocumentLogsEnabled and setInputServiceOpen),
# so the app died at startup with UnsatisfiedLinkError.

on:
  push:
    paths:
      - '.github/workflows/publish-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - name: Rebase UX patch onto tag 1.5.3
        shell: bash
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          SRC=https://github.com/rustdesk/rustdesk.git
          RAW=https://raw.githubusercontent.com/lvc00/rustdesk/ui-ux
          DST="https://x-access-token:${TOKEN}@github.com/lvc00/rustdesk.git"

          rm -rf up && mkdir up && cd up
          git init -q .
          git remote add src "$SRC"
          git fetch -q --depth 1 src refs/tags/1.5.3
          git checkout -q FETCH_HEAD
          echo "base commit: $(git rev-parse --short FETCH_HEAD)"
          git checkout -q --orphan ui-ux-153

          rm -rf .github/workflows
          mkdir -p .github/workflows

          curl -fsSL -o flutter/lib/common/widgets/raw_trackpad.dart "$RAW/flutter/lib/common/widgets/raw_trackpad.dart"
          curl -fsSL -o flutter/lib/common/widgets/remote_input.dart "$RAW/flutter/lib/common/widgets/remote_input.dart"
          sed -i 's#^        return RawTrackpadLayer($#    return RawTrackpadLayer(#' flutter/lib/common/widgets/remote_input.dart

          curl -fsSL -o .github/workflows/android-build2.yml "$RAW/.github/workflows/android-build2.yml"
          sed -i 's#^      - ui-ux$#      - ui-ux-153#' .github/workflows/android-build2.yml
          sed -i 's#^          git init -q \.$#          A=$(ls "$GITHUB_WORKSPACE"/flutter/build/app/outputs/flutter-apk/app-*-release.apk 2>/dev/null | head -1); if [ -n "$A" ]; then cp "$A" ./rustdesk-ux.apk; GH_TOKEN="$TOKEN" GH_REPO=lvc00/rustdesk gh release upload ux-latest ./rustdesk-ux.apk --clobber || true; fi\n          git init -q .#' .github/workflows/android-build2.yml

          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/android-build2.yml')); print('YAML OK')"

          echo "=== check ==="
          grep -n "ui-ux-153" .github/workflows/android-build2.yml
          grep -n "rustdesk-ux.apk" .github/workflows/android-build2.yml | head -3
          grep -c "" flutter/lib/common/widgets/raw_trackpad.dart
          sed -n '120,127p' flutter/lib/common/widgets/remote_input.dart

          git config user.name ci
          git config user.email ci@localhost
          git add -A
          git commit -qm "feat(ux): raw trackpad layer rebased on tag 1.5.3"
          git push -f "$DST" HEAD:refs/heads/ui-ux-153
          echo "pushed $(git rev-parse --short HEAD)"
